  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" id="meta-tema">
  <script>
    /* aplica o tema antes de desenhar (evita "piscar") */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('tema') || 'auto'; } catch (e) {}
      var escuro = t === 'escuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
      document.getElementById('meta-tema').setAttribute('content', escuro ? '#171a20' : '#ffffff');
    })();
  </script>

</head>
